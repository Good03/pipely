project_name: pipely
builds:
  - id: pipely
    main: ./cmd/pipely
    binary: pipely
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

release:
  github:
    owner: Good03
    name: pipely
  draft: true
